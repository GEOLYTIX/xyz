sonar.projectKey=GEOLYTIX_xyz
sonar.organization=geolytix

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=xyz
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=./apps/xyz/mod/,./apps/mapp/lib,./apps/ui/lib,./apps/xyz/server.js, ./apps/saml
sonar.tests=./apps/xyz/tests,./apps/mapp/tests
sonar.test.inclusions=./apps/xyz/tests/**/*.test.mjs,./apps/mapp/tests/**/*.test.mjs
sonar.javascript.lcov.reportPaths=coverage/lcov.info,apps/mapp/coverage/lcov.info

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

# Rules ignored for all files.
# S7726: Default exports are anonymous arrow functions by convention, eg. the query templates.
# S9382: Awaits in loops are intentionally sequential, eg. ordered template merges and retries.
# S7740: Methods assigned to objects alias `this` to a named variable by convention.
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S7726
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S9382
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*
sonar.issue.ignore.multicriteria.e3.ruleKey=javascript:S7740
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*
