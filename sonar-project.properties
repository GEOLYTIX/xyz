sonar.projectKey=GEOLYTIX_xyz
sonar.organization=geolytix

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=xyz
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=./apps/xyz/mod/,./apps/mapp/lib,./apps/xyz/server.js, ./apps/saml
sonar.tests=./apps/xyz/tests,./apps/mapp/tests
sonar.test.inclusions=./apps/xyz/tests/**/*.test.mjs,./apps/mapp/tests/**/*.test.mjs

# Each package writes its own report next to its own vitest.config.mjs.
sonar.javascript.lcov.reportPaths=./apps/xyz/coverage/lcov.info,./apps/mapp/coverage/lcov.info

# apps/mapp/lib/utils/uhtml.mjs is a vendored, minified third party bundle. It
# is excluded from the Vitest coverage report for the same reason.
sonar.exclusions=apps/mapp/lib/utils/uhtml.mjs
sonar.coverage.exclusions=apps/xyz/tests/**,apps/mapp/tests/**,apps/mapp/lib/utils/uhtml.mjs

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8
