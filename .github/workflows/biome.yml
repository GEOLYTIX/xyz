name: Code quality
permissions:
  contents: read
on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Biome
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51
        with:
          version: 2.2.6
      - name: Run Biome
        run: biome ci .
      # The mapp library must work without the MAPP.UI library in apps/ui.
      - name: Check that the mapp library doesn't reference the ui library
        run: |
          if grep -rnE "mapp\??\.ui\b|['\"][^'\"]*apps/ui|['\"](\.\.?/)+ui[/.]" apps/mapp/lib; then
            echo "The mapp library in apps/mapp must not reference the MAPP.UI library."
            exit 1
          fi
