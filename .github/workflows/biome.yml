name: Code quality
permissions:
  contents: read
on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Biome
        uses: biomejs/setup-biome@a05c02a1304287da45f13648675a70d5841acdbc
        with:
          version: 2.2.6
      - name: Run Biome
        run: biome ci .
