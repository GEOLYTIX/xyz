name: Knowledge check

on:
  pull_request:
    branches: ['main', 'major', 'minor', 'patch']
  push:
    branches: ['main', 'major', 'minor', 'patch']

# The freshness check of pull requests runs in knowledge-freshness.yml, so a
# label change does not run this workflow again.

permissions:
  contents: read

# A newer push to the same pull request or branch supersedes a running check.
concurrency:
  group: knowledge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  knowledge:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: pnpm install --ignore-scripts
      - name: Test the validator
        run: pnpm knowledge:test
      - name: Validate knowledge and source links
        run: pnpm knowledge:check
      - name: Run the workspace examples against the devdb
        run: pnpm knowledge:examples
      # The build fails on dead links, which would otherwise surface on publishing.
      - name: Build the knowledge portal
        run: pnpm knowledge:site:build
