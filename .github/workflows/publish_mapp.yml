name: Publish MAPP

# Publishes the @geolytix/mapp package to npm. The workflow only runs on a
# manual dispatch, after a maintainer decided that a release has MAPP changes
# to publish, see RELEASING.md.
#
# The workflow publishes the ref it is dispatched from, the "Use workflow
# from" branch or tag. The deployment branch and tag rules of the npm
# environment apply to this ref, so only a permitted ref can be published.
#
# - latest: publishes the version of a release tag, eg. v5.1.0.
# - next: publishes a prerelease of a branch or tag, eg. 5.1.0-rc.2 from minor.
#
# npm trusted publishing authenticates the workflow with OIDC, so there is no
# npm token. The trusted publisher on npm names this workflow file and the npm
# environment. The npm environment requires the approval of a reviewer.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 'The npm dist-tag.'
        required: true
        type: choice
        options:
          - next
          - latest
        default: next
      prerelease:
        description: 'The prerelease identifier for next, eg. rc.2 publishes 5.1.0-rc.2.'
        required: false
        type: string

concurrency:
  group: publish-mapp
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @geolytix/mapp
    runs-on: ubuntu-26.04
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      # Checks out github.ref, the ref the workflow is dispatched from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Node 24 ships an npm version with trusted publishing.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Check the npm version
        run: |
          npm_version=$(npm --version)
          echo "npm $npm_version"
          node -e "
            const [major, minor, patch] = '$npm_version'.split('.').map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) { console.error('Trusted publishing requires npm 11.5.1 or later.'); process.exit(1); }
          "

      - name: Resolve the version
        id: version
        env:
          REF: ${{ github.ref }}
          DIST_TAG: ${{ inputs.dist_tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          node utils/check-version.js
          base=$(node -p "require('./apps/mapp/package.json').version")

          if [ "$DIST_TAG" = "latest" ]; then
            if [ -n "$PRERELEASE" ]; then
              echo "::error::A prerelease is published with the next dist-tag."
              exit 1
            fi
            if [ "$REF" != "refs/tags/v$base" ]; then
              echo "::error::latest publishes a release tag. Dispatch the workflow from the tag v$base, not $REF."
              exit 1
            fi
            version="$base"
          else
            if ! [[ "$PRERELEASE" =~ ^[0-9A-Za-z]+(\.[0-9A-Za-z]+)*$ ]]; then
              echo "::error::next requires a prerelease identifier, eg. rc.2."
              exit 1
            fi
            version="$base-$PRERELEASE"
          fi

          if npm view "@geolytix/mapp@$version" version > /dev/null 2>&1; then
            echo "::error::@geolytix/mapp@$version is already published."
            exit 1
          fi

          echo "Publishing @geolytix/mapp@$version with the $DIST_TAG dist-tag."
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Install Chromium for the MAPP browser tests
        run: pnpm --filter=@geolytix/mapp exec playwright install --with-deps chromium

      - name: Test
        run: pnpm --filter=@geolytix/mapp test

      - name: Build
        run: pnpm build --filter=@geolytix/mapp --force

      # The prerelease version is only set in the workflow checkout.
      - name: Set the prerelease version
        if: inputs.dist_tag == 'next'
        working-directory: apps/mapp
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm pkg set "version=$VERSION"

      - name: Pack and check the tarball
        run: pnpm --filter=@geolytix/mapp pack:check

      - name: Install the tarball
        run: pnpm --filter=@geolytix/mapp pack:install

      - name: Package test
        run: pnpm --filter=@geolytix/mapp test:package

      # npm publishes the tarball as it is, so the published dist.integrity is
      # the integrity of the tested tarball.
      - name: Record the tarball integrity
        id: tarball
        working-directory: apps/mapp/.pack
        run: echo "integrity=sha512-$(openssl dgst -sha512 -binary geolytix-mapp.tgz | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Publish
        working-directory: apps/mapp/.pack
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
        run: npm publish geolytix-mapp.tgz --provenance --access public --tag "$DIST_TAG"

      # The steps after the publish can't undo it. A failure is an alarm, see
      # "Check the published version" in RELEASING.md.
      - name: Verify the published version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIST_TAG: ${{ inputs.dist_tag }}
          INTEGRITY: ${{ steps.tarball.outputs.integrity }}
        run: |
          for i in $(seq 1 30); do
            if [ "$(npm view @geolytix/mapp "dist-tags.$DIST_TAG" --prefer-online 2>/dev/null)" = "$VERSION" ]; then
              found=1
              break
            fi
            sleep 10
          done
          if [ -z "$found" ]; then
            echo "::error::The $DIST_TAG dist-tag isn't $VERSION after 5 minutes."
            exit 1
          fi

          published=$(npm view "@geolytix/mapp@$VERSION" dist.integrity --prefer-online)
          if [ "$published" != "$INTEGRITY" ]; then
            echo "::error::The published integrity $published isn't the integrity of the tested tarball $INTEGRITY."
            exit 1
          fi

          provenance=$(npm view "@geolytix/mapp@$VERSION" dist.attestations.provenance.predicateType --prefer-online)
          if [ "$provenance" != "https://slsa.dev/provenance/v1" ]; then
            echo "::error::@geolytix/mapp@$VERSION has no provenance attestation."
            exit 1
          fi

          # npm audit signatures verifies the registry signature and the
          # attestation of the installed package.
          audit="$RUNNER_TEMP/audit"
          mkdir "$audit"
          cd "$audit"
          npm init -y > /dev/null
          npm install "@geolytix/mapp@$VERSION" --no-audit --no-fund
          npm audit signatures

      - name: Package test with the published version
        working-directory: apps/mapp
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/installPackage.mjs --version="$VERSION"
          pnpm test:package

      # The exact version url is only requested once the registry has the
      # version. jsDelivr caches the dist-tag urls for 12 hours, the purge
      # updates them to the new version.
      - name: Check jsDelivr serves the published version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          cdn="https://cdn.jsdelivr.net/npm/@geolytix/mapp@$VERSION/dist"
          for i in $(seq 1 12); do
            if curl -sf "$cdn/mapp.js" -o "$RUNNER_TEMP/mapp.js" && curl -sf "$cdn/mapp.css" -o "$RUNNER_TEMP/mapp.css"; then
              served=1
              break
            fi
            sleep 10
          done
          if [ -z "$served" ]; then
            echo "::error::jsDelivr doesn't serve @geolytix/mapp@$VERSION after 2 minutes."
            exit 1
          fi
          cmp "$RUNNER_TEMP/mapp.js" apps/mapp/dist/mapp.js
          cmp "$RUNNER_TEMP/mapp.css" apps/mapp/dist/mapp.css

          for file in mapp.js mapp.js.map mapp.css; do
            curl -sf "https://purge.jsdelivr.net/npm/@geolytix/mapp@$DIST_TAG/dist/$file" > /dev/null \
              || echo "::warning::The jsDelivr purge of @$DIST_TAG/dist/$file failed."
          done
