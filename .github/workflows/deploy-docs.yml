# Builds the knowledge portal from knowledge/ with VitePress and deploys it to GitHub Pages.
#
# The Release workflow calls this workflow after it has created a release, with the release tag, so the portal is
# only published for a release which succeeded and is built from the tagged commit. A manual run publishes a
# correction between releases, or the minor for evaluation before a release, from a release line branch, a release
# tag or a commit. A tag must exist and a commit must be on main, minor or patch, so a run cannot publish a commit
# of an unmerged branch. The ref is resolved to a commit once; source links and the footer use the tag or that commit.
#
# GitHub Pages is set up after the knowledge migration is merged into minor: the repository Pages source must be
# GitHub Actions, and the github-pages environment must allow the branch a run starts from, which is main for a
# release and the branch selected for a manual run. Pull requests build the portal in the Knowledge check workflow.
name: Deploy the knowledge portal to Pages

on:
  workflow_call:
    inputs:
      ref:
        description: 'Release tag to build the portal from'
        required: true
        type: string

  workflow_dispatch:
    inputs:
      ref:
        description: 'Release line branch (main, minor, patch), existing release tag, or full SHA of a commit on a release line'
        required: true
        default: 'main'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    # Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
    # However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
    concurrency:
      group: 'pages'
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    steps:
      - name: Check the ref
        env:
          REF: ${{ inputs.ref }}
        run: |
          case "$REF" in
            main | minor | patch) ;;
            *)
              if ! [[ "$REF" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ || "$REF" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::$REF is not a release line branch, release tag or full commit SHA."
                exit 1
              fi
              ;;
          esac
      # The full history has the release line branches and the tags which the ref is verified against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Verify the ref
        env:
          REF: ${{ inputs.ref }}
        run: |
          case "$REF" in
            main | minor | patch) ;;
            *)
              if [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
                for branch in main minor patch; do
                  if git merge-base --is-ancestor "$REF" "origin/$branch" 2> /dev/null; then
                    echo "$REF is on $branch"
                    exit 0
                  fi
                done
                echo "::error::$REF is not a commit of main, minor or patch."
                exit 1
              fi
              if ! git show-ref --verify --quiet "refs/tags/$REF"; then
                echo "::error::$REF is not a release tag of the repository."
                exit 1
              fi
              ;;
          esac
      # A branch moves while a run is queued; links name the tag or the commit which was built.
      - name: Resolve the ref
        id: ref
        env:
          REF: ${{ inputs.ref }}
        run: |
          sha=$(git rev-parse HEAD)
          if git show-ref --verify --quiet "refs/tags/$REF"; then
            echo "links=$REF" >> "$GITHUB_OUTPUT"
          else
            echo "links=$sha" >> "$GITHUB_OUTPUT"
          fi
          # Concepts are edited on a release line branch; a tag or commit is corrected on patch.
          case "$REF" in
            main | minor | patch) echo "edit=$REF" >> "$GITHUB_OUTPUT" ;;
            *) echo "edit=patch" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "Building $REF at $sha"
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install dependencies
        run: pnpm install --ignore-scripts
      - name: Build the knowledge portal
        run: pnpm knowledge:site:build
        env:
          KNOWLEDGE_SITE_BASE: ${{ steps.pages.outputs.base_path }}/
          KNOWLEDGE_SITE_REF: ${{ steps.ref.outputs.links }}
          KNOWLEDGE_SITE_EDIT_REF: ${{ steps.ref.outputs.edit }}
          KNOWLEDGE_SITE_REPO: ${{ github.server_url }}/${{ github.repository }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: 'utils/knowledge/site/.vitepress/dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
