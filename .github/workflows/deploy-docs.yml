# Builds the knowledge portal from knowledge/ with VitePress and deploys it to GitHub Pages.
#
# GitHub Pages is set up after the knowledge migration is merged into minor: the repository Pages source must be
# GitHub Actions, and the github-pages environment must allow the branches deployed from. Until the v5.1 release, a
# manual run with the minor ref publishes the portal for evaluation of the minor. Pull requests are reviewed with a
# local build: pnpm knowledge:site:build && pnpm knowledge:site:preview.
name: Deploy the knowledge portal to Pages

on:
  # A push to main is a release.
  push:
    branches: ['main']

  # Publishes a correction between releases from the release line which carries it, eg. patch.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit to build the portal from'
        required: true
        default: 'main'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install dependencies
        run: pnpm install --ignore-scripts
      - name: Build the knowledge portal
        run: pnpm knowledge:site:build
        env:
          KNOWLEDGE_SITE_BASE: ${{ steps.pages.outputs.base_path }}/
          KNOWLEDGE_SITE_REF: ${{ inputs.ref || github.ref_name }}
          KNOWLEDGE_SITE_REPO: ${{ github.server_url }}/${{ github.repository }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: 'utils/knowledge/site/.vitepress/dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
