name: Release

# The MAPP bundles in public/js/lib and public/css are gitignored on every
# branch. A push to main with an untagged package.json version builds the
# bundles, commits them on top of main without pushing that commit to any
# branch, and tags it. The tag is the only ref which carries the build output.

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(node -p "require('./package.json').version")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "Tag $tag already exists, skipping build."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists, nothing to release."
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            test -f "release-notes/$tag.md"
          fi

      - name: Install pnpm
        if: steps.version.outputs.exists != 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.version.outputs.exists != 'true'
        with:
          node-version: '22'

      - name: Install dependencies
        if: steps.version.outputs.exists != 'true'
        run: pnpm install --ignore-scripts

      - name: Test
        if: steps.version.outputs.exists != 'true'
        run: pnpm test

      - name: Build MAPP bundles
        if: steps.version.outputs.exists != 'true'
        run: pnpm build --filter=@geolytix/mapp --force

      - name: Commit build and push tag
        if: steps.version.outputs.exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add --force public/js/lib public/css/mapp.css public/css/ui.css
          git commit -m "Build $TAG"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/$TAG"

      # Checked separately from the tag so a rerun creates the release
      # when a previous run pushed the tag but failed to create the release.
      - name: Create GitHub release
        if: steps.version.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --notes-file "release-notes/$TAG.md"
