packages:
  - apps/auth
  - apps/mapp
  - apps/saml
  - apps/xyz
allowBuilds:
  bcrypt: false
  esbuild: false
catalog:
  "@aws-sdk/client-s3": ^3.691.0
  "@aws-sdk/cloudfront-signer": ^3.621.0
  "@aws-sdk/s3-request-presigner": ^3.691.0
  "@biomejs/biome": 2.2.6
  "@node-saml/node-saml": ^5.0.1
  "@varlock/google-secret-manager-plugin": 1.2.0
  "@varlock/vite-integration": 1.1.3
  "@vitest/browser": 4.1.4
  "@vitest/browser-playwright": 4.1.4
  "@vitest/coverage-v8": 4.1.4
  bcrypt: ^6.0.0
  clean-jsdoc-theme: ^4.3.2
  cookie-parser: ^1.4.5
  express: 5.2.0
  express-rate-limit: ^7.5.1
  happy-dom: ^20.11.1
  jsonwebtoken: ^9.0.2
  node-mocks-http: ^1.17.2
  # Pinned to the version the mapp library checks for in lib/mapp.mjs
  # (ol_current) and that tests/lib/stubs/ol.mjs reports. A mismatch is a real
  # signal rather than test noise, so this moves deliberately.
  ol: 10.8.0
  pg: ~8.15.1
  playwright: ^1.62.0
  resend: ^6.4.2
  turbo: ^2.9.6
  undici: ^7.25.0
  varlock: 1.7.2
  vite: 8.0.16
  vitest: 4.1.4
minimumReleaseAgeExclude:
  - '@varlock/google-secret-manager-plugin'
  - varlock
