packages:
  - apps/auth
  - apps/mapp
  - apps/saml
  - apps/ui
  - apps/xyz
  - packages/devdb
  - packages/testhost
allowBuilds:
  bcrypt: true
  esbuild: true
catalog:
  "@aws-sdk/client-s3": ^3.691.0
  "@aws-sdk/cloudfront-signer": ^3.621.0
  "@aws-sdk/s3-request-presigner": ^3.691.0
  "@biomejs/biome": 2.2.6
  "@electric-sql/pglite": 0.5.8
  "@electric-sql/pglite-postgis": 0.2.8
  "@electric-sql/pglite-socket": 0.2.11
  "@node-saml/node-saml": ^5.2.0
  "@opentelemetry/api": ^1.9.1
  "@opentelemetry/exporter-trace-otlp-http": ^0.222.0
  "@opentelemetry/resources": ^2.11.0
  "@opentelemetry/sdk-trace-node": ^2.11.0
  "@playwright/test": 1.64.1
  "@varlock/google-secret-manager-plugin": 1.2.4
  "@varlock/vite-integration": 1.5.6
  "@vitest/browser-playwright": 4.1.10
  "@vitest/coverage-v8": 4.1.10
  bcrypt: ^6.0.0
  cookie-parser: ^1.4.5
  express: 5.2.0
  express-rate-limit: ^7.5.1
  jsonwebtoken: ^9.0.2
  markdown-it: 14.3.0
  markdown-it-footnote: 4.0.0
  node-mocks-http: ^1.17.2
  ol: 10.8.0
  pg: ~8.15.1
  publint: 0.3.25
  playwright: 1.64.1
  resend: ^6.4.2
  turbo: ^2.9.6
  undici: ^7.25.0
  vt-pbf: 3.1.3
  varlock: 1.25.0
  vite: 8.0.16
  vitepress: 1.6.4
  vitest: 4.1.10
  xml-crypto: ^6.1.2
  yaml: 2.9.1
minimumReleaseAgeExclude:
  - '@varlock/google-secret-manager-plugin'
  - varlock
# varlock's native helper binaries back local/keychain encryption, which this repo does not use.
# Varlock falls back to its file backend without them, and skipping them keeps antivirus-flagged executables out of node_modules (#3104).
ignoredOptionalDependencies:
  - '@varlock/native-helper-darwin'
  - '@varlock/native-helper-linux-arm64'
  - '@varlock/native-helper-linux-x64'
  - '@varlock/native-helper-win32-x64'
