<!doctype html>
<html lang="en">
  <head>
    <title>XYZ TESTVIEW</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script
      src="https://cdn.jsdelivr.net/npm/ol@v10.8.0/dist/ol.js"
      integrity="sha384-MW7s77hf0z6FJ3pLxOJ3STIrnMERs4FRQEDpqDrHpJX1mG0qr5Zd9glUb5XC4dA0"
      crossorigin="anonymous"
    ></script>

    <link rel="stylesheet" href="/mapp/css/_mapp.css">

    <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 4px;
      padding: 4px;
      box-sizing: border-box;
    }

    .testview {
      position: relative;
      border: 1px solid #ccc;
    }

    .testview > .map {
      position: absolute;
      inset: 0;
    }

    .testview > h2 {
      position: absolute;
      z-index: 1;
      top: 4px;
      left: 4px;
      margin: 0;
      padding: 2px 6px;
      font-size: 14px;
      background: #fffc;
    }
    </style>

    <script type="module" src="./testview.mjs"></script>
  </head>

  <body></body>
</html>
