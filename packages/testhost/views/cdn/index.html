<!doctype html>
<html lang="en">
  <head>
    <title>XYZ CDN VIEW</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Openlayers must be loaded as the ol global before the MAPP library. -->
    <script
      src="https://cdn.jsdelivr.net/npm/ol@v10.8.0/dist/ol.js"
      integrity="sha384-MW7s77hf0z6FJ3pLxOJ3STIrnMERs4FRQEDpqDrHpJX1mG0qr5Zd9glUb5XC4dA0"
      crossorigin="anonymous"
    ></script>

    <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    #map {
      position: absolute;
      inset: 0;
    }

    #version {
      position: absolute;
      z-index: 1;
      top: 4px;
      left: 4px;
      margin: 0;
      padding: 2px 6px;
      font: 14px sans-serif;
      background: #fffc;
    }
    </style>

    <script type="module" src="./cdn.mjs"></script>
  </head>

  <body>
    <div id="map"></div>
    <p id="version"></p>
  </body>
</html>
