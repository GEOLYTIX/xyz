<!doctype html>
<html lang="en">
  <head>
    <title>XYZ TESTHOST LOCALE</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script
      src="https://cdn.jsdelivr.net/npm/ol@v10.8.0/dist/ol.js"
      integrity="sha384-MW7s77hf0z6FJ3pLxOJ3STIrnMERs4FRQEDpqDrHpJX1mG0qr5Zd9glUb5XC4dA0"
      crossorigin="anonymous"
    ></script>

    <link rel="stylesheet" href="/mapp/css/_mapp.css">

    <style>
    html,
    body {
      height: 100%;
      margin: 0;
      font-family: sans-serif;
    }

    body {
      display: grid;
      grid-template-columns: 240px 1fr;
    }

    #panel {
      overflow: auto;
      padding: 8px;
      border-right: 1px solid #ccc;
      font-size: 14px;
    }

    #panel h2 {
      margin: 0 0 8px;
      font-size: 16px;
    }

    #panel label {
      display: block;
      margin: 4px 0;
    }

    #panel .error {
      color: #c00;
      white-space: pre-wrap;
    }

    #map {
      position: relative;
    }
    </style>

    <script type="module" src="./locale.mjs"></script>
  </head>

  <body>
    <div id="panel"></div>
    <div id="map"></div>
  </body>
</html>
